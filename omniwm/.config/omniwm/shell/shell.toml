profile = "default"

[profiles]

[profiles.default]
theme = "tokyo-night"
center = ["media"]
leading = ["apple-menu", "app-menu", "stats", "workspaces"]
trailing = ["menu-extras", "volume", "battery-details", "control-center", "notifications", "clock"]

[profiles.default.hiddenBar]
enabled = true

[profiles.default.widgets]

[profiles.default.widgets.clock]
date = true
icon = false
interval = 1

[profiles.default.widgets.menu-extras]
order = ["hotspot", "windows app", "remote desktop", "tunnelblick", "slack", "teams", "outlook"]

[profiles.default.widgets.stats]
variant = "graph"

[profiles.default.widgets.workspaces]
compact = false
indicator = "underline"
occupiedBackground = false

[profiles.default.workspaceBar]
autoHide = false
backgroundOpacity = 1.0
height = 34.0
hideEmptyWorkspaces = true
notificationBadges = "text"
showItemBackgrounds = false
solidBlackBackground = false
transparentBackground = false
yOffset = 0.0
